<!doctype html>
<html class="h-full" lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>QR Studio — Professional Client-Side QR Code Generator</title>
    <meta
      content="Client-side vector and raster QR code generator with real-time scan verification, custom geometry, emblems, and zero tracking."
      name="description"
    >
    <meta content="#121316" name="theme-color">

    <!-- Open Graph & Social Cards -->
    <meta content="website" property="og:type">
    <meta
      content="QR Studio — Professional Client-Side QR Code Generator"
      property="og:title"
    >
    <meta
      content="Client-side vector and raster QR code generator with real-time scan verification, custom geometry, emblems, and zero tracking."
      property="og:description"
    >
    <meta content="./og-image.png" property="og:image">
    <meta content="1200" property="og:image:width">
    <meta content="630" property="og:image:height">

    <!-- Twitter Cards -->
    <meta content="summary_large_image" name="twitter:card">
    <meta
      content="QR Studio — Professional Client-Side QR Code Generator"
      name="twitter:title"
    >
    <meta
      content="Client-side vector and raster QR code generator with real-time scan verification, custom geometry, emblems, and zero tracking."
      name="twitter:description"
    >
    <meta content="./og-image.png" name="twitter:image">

    <!-- Icons & PWA -->
    <link href="./favicon.svg" rel="icon" type="image/svg+xml">
    <link href="./apple-touch-icon.png" rel="apple-touch-icon">
    <link href="./manifest.webmanifest" rel="manifest">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      media="print"
      onload="this.media = 'all'"
      rel="stylesheet"
    >
    <noscript
      ><link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
        rel="stylesheet"
      ></noscript
    >

    <!-- 3-Tier Design Token System & FSD Styles -->
    <link href="./src/app/styles/index.css" rel="stylesheet">
  </head>
  <body class="flex min-h-screen items-center justify-center p-8">
    <!-- Toast Notification Layer -->
    <div
      aria-live="polite"
      class="pointer-events-none fixed top-5 right-5 z-50 flex flex-col gap-2"
      id="toast-container"
    ></div>

    <!-- Main Studio Window Container -->
    <main
      class="w-studio surface-panel shadow-studio flex flex-col overflow-hidden rounded-2xl border border-neutral-200"
      id="studio-window"
    >
      <div class="grid grid-cols-2 items-stretch divide-x divide-neutral-200">
        <!-- LEFT COLUMN: Controls & Header -->
        <section
          aria-label="Generator Controls"
          class="surface-panel flex flex-col overflow-hidden"
        >
          <!-- Panel Local Header Bar with Matrix Info & Icon Reset Button -->
          <header
            class="surface-panel flex h-12 shrink-0 items-center justify-between border-b border-neutral-200 px-6"
          >
            <h1
              class="text-title leading-none font-medium tracking-tight text-neutral-800"
            >
              QR-Code Generator
            </h1>

            <div class="flex items-center gap-2.5">
              <span
                class="font-mono text-xs font-medium text-neutral-500 select-none"
                id="matrix-info"
                >29 × 29</span
              >
              <button
                aria-label="Reset all settings to default"
                class="btn-reset-icon surface-btn-secondary hover:surface-btn-secondary flex h-7 w-7 items-center justify-center rounded-md text-neutral-500 hover:text-neutral-900"
                id="btn-reset"
                title="Reset all settings & clear cache"
                type="button"
              >
                <svg
                  aria-hidden="true"
                  class="h-3.5 w-3.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                  <path d="M3 3v5h5" />
                </svg>
              </button>
            </div>
          </header>

          <!-- Panel Content Body (Auto-fitting height without dead space) -->
          <div class="flex flex-1 flex-col justify-between gap-3.5 p-6">
            <!-- SECTION 1: Content -->
            <div class="flex flex-col gap-2">
              <span class="text-xs font-medium text-neutral-700">Content</span>

              <!-- Payload Type Selector (9 types) -->
              <div
                aria-label="Payload Type"
                class="segmented-track h-8 grid-cols-9"
                role="tablist"
              >
                <button
                  aria-controls="field-url"
                  aria-selected="true"
                  class="segmented-item active"
                  data-type="url"
                  id="tab-url"
                  role="tab"
                  title="Web Link"
                  type="button"
                >
                  <svg
                    aria-hidden="true"
                    class="h-3.5 w-3.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2.2"
                    viewBox="0 0 24 24"
                  >
                    <path
                      d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                    ></path>
                    <path
                      d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                    ></path>
                  </svg>
                </button>
                <button
                  aria-controls="field-tel"
                  aria-selected="false"
                  class="segmented-item"
                  data-type="tel"
                  id="tab-tel"
                  role="tab"
                  title="Phone Call"
                  type="button"
                >
                  <svg
                    aria-hidden="true"
                    class="h-3.5 w-3.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2.2"
                    viewBox="0 0 24 24"
                  >
                    <path
                      d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
                    ></path>
                  </svg>
                </button>
                <button
                  aria-controls="field-wifi"
                  aria-selected="false"
                  class="segmented-item"
                  data-type="wifi"
                  id="tab-wifi"
                  role="tab"
                  title="Wi-Fi Hotspot"
                  type="button"
                >
                  <svg
                    aria-hidden="true"
                    class="h-3.5 w-3.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2.2"
                    viewBox="0 0 24 24"
                  >
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                    <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <line x1="12" x2="12.01" y1="20" y2="20"></line>
                  </svg>
                </button>
                <button
                  aria-controls="field-email"
                  aria-selected="false"
                  class="segmented-item"
                  data-type="email"
                  id="tab-email"
                  role="tab"
                  title="Email (Mailto)"
                  type="button"
                >
                  <svg
                    aria-hidden="true"
                    class="h-3.5 w-3.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2.2"
                    viewBox="0 0 24 24"
                  >
                    <path
                      d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                    ></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                  </svg>
                </button>
                <button
                  aria-controls="field-sms"
                  aria-selected="false"
                  class="segmented-item"
                  data-type="sms"
                  id="tab-sms"
                  role="tab"
                  title="SMS Message"
                  type="button"
                >
                  <svg
                    aria-hidden="true"
                    class="h-3.5 w-3.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2.2"
                    viewBox="0 0 24 24"
                  >
                    <path
                      d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
                    ></path>
                  </svg>
                </button>
                <button
                  aria-controls="field-text"
                  aria-selected="false"
                  class="segmented-item"
                  data-type="text"
                  id="tab-text"
                  role="tab"
                  title="Plain Text"
                  type="button"
                >
                  <svg
                    aria-hidden="true"
                    class="h-3.5 w-3.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2.2"
                    viewBox="0 0 24 24"
                  >
                    <line x1="17" x2="3" y1="10" y2="10"></line>
                    <line x1="21" x2="3" y1="6" y2="6"></line>
                    <line x1="21" x2="3" y1="14" y2="14"></line>
                    <line x1="13" x2="3" y1="18" y2="18"></line>
                  </svg>
                </button>
                <button
                  aria-controls="field-vcard"
                  aria-selected="false"
                  class="segmented-item"
                  data-type="vcard"
                  id="tab-vcard"
                  role="tab"
                  title="vCard Contact"
                  type="button"
                >
                  <svg
                    aria-hidden="true"
                    class="h-3.5 w-3.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2.2"
                    viewBox="0 0 24 24"
                  >
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </button>
                <button
                  aria-controls="field-geo"
                  aria-selected="false"
                  class="segmented-item"
                  data-type="geo"
                  id="tab-geo"
                  role="tab"
                  title="Geo Location (GPS)"
                  type="button"
                >
                  <svg
                    aria-hidden="true"
                    class="h-3.5 w-3.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2.2"
                    viewBox="0 0 24 24"
                  >
                    <path
                      d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"
                    ></path>
                    <circle cx="12" cy="10" r="3"></circle>
                  </svg>
                </button>
                <button
                  aria-controls="field-sbp"
                  aria-selected="false"
                  class="segmented-item"
                  data-type="sbp"
                  id="tab-sbp"
                  role="tab"
                  title="СБП payment"
                  type="button"
                >
                  <span class="text-micro font-medium tracking-tight">СБП</span>
                </button>
              </div>

              <div
                class="flex w-full flex-col justify-start"
                id="payload-accordion-container"
              >
                <div class="flex w-full flex-col" id="payload-accordion-inner">
                  <!-- Web URL -->
                  <div
                    aria-labelledby="tab-url"
                    class="type-field flex w-full flex-col"
                    id="field-url"
                    role="tabpanel"
                  >
                    <div
                      class="surface-control-field focus-within:surface-panel focus-within:shadow-field relative flex h-8 w-full items-center overflow-hidden rounded-lg border border-transparent transition-all focus-within:border-neutral-300"
                    >
                      <label
                        aria-label="Web URL Icon"
                        class="shrink-0 pl-2.5 text-neutral-500"
                        for="input-url"
                      >
                        <svg
                          aria-hidden="true"
                          class="h-3.5 w-3.5"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          viewBox="0 0 24 24"
                        >
                          <circle cx="12" cy="12" r="10"></circle>
                          <line x1="2" x2="22" y1="12" y2="12"></line>
                          <path
                            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
                          ></path>
                        </svg>
                      </label>
                      <input
                        aria-label="Web URL"
                        autocomplete="off"
                        class="min-w-0 flex-1 bg-transparent px-2 text-xs font-medium text-neutral-900 placeholder-neutral-500 outline-none"
                        id="input-url"
                        placeholder="https://example.com"
                        spellcheck="false"
                        type="text"
                        value=""
                      >

                      <button
                        aria-label="Clear Web URL input"
                        class="btn-clear btn-icon-tactile flex h-full shrink-0 items-center justify-center px-1.5 text-neutral-500 transition-colors hover:text-neutral-800"
                        data-target="input-url"
                        title="Clear field"
                        type="button"
                      >
                        <svg
                          aria-hidden="true"
                          class="h-3.5 w-3.5"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          viewBox="0 0 24 24"
                        >
                          <line x1="18" x2="6" y1="6" y2="18"></line>
                          <line x1="6" x2="18" y1="6" y2="18"></line>
                        </svg>
                      </button>

                      <button
                        aria-label="Paste URL from clipboard"
                        class="btn-icon-tactile hover:surface-control-field flex h-full shrink-0 items-center justify-center border-l border-neutral-300 px-2.5 text-neutral-600 transition-colors hover:text-neutral-900"
                        id="btn-paste-url"
                        title="Paste from clipboard"
                        type="button"
                      >
                        <svg
                          aria-hidden="true"
                          class="h-3.5 w-3.5"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          viewBox="0 0 24 24"
                        >
                          <path
                            d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
                          ></path>
                          <rect
                            height="4"
                            rx="1"
                            ry="1"
                            width="8"
                            x="8"
                            y="2"
                          ></rect>
                        </svg>
                      </button>
                    </div>
                  </div>

                  <!-- Phone Call (tel:) -->
                  <div
                    aria-labelledby="tab-tel"
                    class="type-field hidden w-full flex-col"
                    id="field-tel"
                    role="tabpanel"
                  >
                    <div
                      class="surface-control-field focus-within:surface-panel focus-within:shadow-field relative flex h-8 w-full items-center overflow-hidden rounded-lg border border-transparent transition-all focus-within:border-neutral-300"
                    >
                      <label
                        aria-label="Phone Icon"
                        class="shrink-0 pl-2.5 text-neutral-500"
                        for="tel-phone"
                      >
                        <svg
                          aria-hidden="true"
                          class="h-3.5 w-3.5"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          viewBox="0 0 24 24"
                        >
                          <path
                            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
                          ></path>
                        </svg>
                      </label>
                      <input
                        aria-label="Phone number for call"
                        autocomplete="off"
                        class="min-w-0 flex-1 bg-transparent px-2 text-xs font-medium text-neutral-900 placeholder-neutral-500 outline-none"
                        id="tel-phone"
                        placeholder="+1 555 000-0000"
                        spellcheck="false"
                        type="tel"
                        value=""
                      >

                      <button
                        aria-label="Clear phone input"
                        class="btn-clear btn-icon-tactile flex h-full shrink-0 items-center justify-center px-1.5 text-neutral-500 transition-colors hover:text-neutral-800"
                        data-target="tel-phone"
                        title="Clear field"
                        type="button"
                      >
                        <svg
                          aria-hidden="true"
                          class="h-3.5 w-3.5"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          viewBox="0 0 24 24"
                        >
                          <line x1="18" x2="6" y1="6" y2="18"></line>
                          <line x1="6" x2="18" y1="6" y2="18"></line>
                        </svg>
                      </button>
                    </div>
                  </div>

                  <!-- Email (Mailto) -->
                  <div
                    aria-labelledby="tab-email"
                    class="type-field hidden w-full flex-col gap-2"
                    id="field-email"
                    role="tabpanel"
                  >
                    <div
                      class="surface-control-field focus-within:surface-panel focus-within:shadow-field flex h-8 w-full items-center overflow-hidden rounded-lg border border-transparent transition-all focus-within:border-neutral-300"
                    >
                      <input
                        aria-label="Recipient email address"
                        class="min-w-0 flex-1 bg-transparent px-2.5 text-xs font-medium text-neutral-900 placeholder-neutral-500 outline-none"
                        id="email-to"
                        placeholder="Recipient (e.g. hello@example.com)"
                        type="email"
                      >
                      <button
                        aria-label="Clear recipient input"
                        class="btn-clear btn-icon-tactile flex h-full shrink-0 items-center justify-center px-1.5 text-neutral-500 transition-colors hover:text-neutral-800"
                        data-group="email"
                        data-target="email-to"
                        title="Clear all email fields"
                        type="button"
                      >
                        <svg
                          aria-hidden="true"
                          class="h-3.5 w-3.5"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          viewBox="0 0 24 24"
                        >
                          <line x1="18" x2="6" y1="6" y2="18"></line>
                          <line x1="6" x2="18" y1="6" y2="18"></line>
                        </svg>
                      </button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                      <input
                        aria-label="Email Subject"
                        class="field-input h-8 px-2.5 text-xs font-medium placeholder-neutral-500"
                        id="email-subject"
                        placeholder="Subject"
                        type="text"
                      >
                      <input
                        aria-label="Email message body"
                        class="field-input h-8 px-2.5 text-xs font-medium placeholder-neutral-500"
                        id="email-body"
                        placeholder="Message body"
                        type="text"
                      >
                    </div>
                  </div>

                  <!-- SMS -->
                  <div
                    aria-labelledby="tab-sms"
                    class="type-field hidden w-full flex-col gap-2"
                    id="field-sms"
                    role="tabpanel"
                  >
                    <div
                      class="surface-control-field focus-within:surface-panel focus-within:shadow-field flex h-8 w-full items-center overflow-hidden rounded-lg border border-transparent transition-all focus-within:border-neutral-300"
                    >
                      <input
                        aria-label="SMS Phone number"
                        class="min-w-0 flex-1 bg-transparent px-2.5 text-xs font-medium text-neutral-900 placeholder-neutral-500 outline-none"
                        id="sms-phone"
                        placeholder="Phone number (+1 555 000-0000)"
                        type="tel"
                      >
                      <button
                        aria-label="Clear phone input"
                        class="btn-clear btn-icon-tactile flex h-full shrink-0 items-center justify-center px-1.5 text-neutral-500 transition-colors hover:text-neutral-800"
                        data-group="sms"
                        data-target="sms-phone"
                        title="Clear SMS fields"
                        type="button"
                      >
                        <svg
                          aria-hidden="true"
                          class="h-3.5 w-3.5"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          viewBox="0 0 24 24"
                        >
                          <line x1="18" x2="6" y1="6" y2="18"></line>
                          <line x1="6" x2="18" y1="6" y2="18"></line>
                        </svg>
                      </button>
                    </div>
                    <input
                      aria-label="SMS message body"
                      class="field-input h-8 w-full px-2.5 text-xs font-medium placeholder-neutral-500"
                      id="sms-body"
                      placeholder="SMS text (optional)"
                      type="text"
                    >
                  </div>

                  <!-- Wi-Fi Network -->
                  <div
                    aria-labelledby="tab-wifi"
                    class="type-field hidden w-full flex-col gap-2"
                    id="field-wifi"
                    role="tabpanel"
                  >
                    <div class="grid grid-cols-2 gap-2">
                      <div class="relative flex items-center">
                        <input
                          aria-label="Wi-Fi SSID network name"
                          class="field-input h-8 w-full px-2.5 pr-7 text-xs font-medium placeholder-neutral-500"
                          id="wifi-ssid"
                          placeholder="SSID (Network Name)"
                          type="text"
                        >
                        <button
                          aria-label="Clear Wi-Fi fields"
                          class="btn-clear btn-icon-tactile absolute right-1 flex h-6 w-6 items-center justify-center text-neutral-500 transition-colors hover:text-neutral-800"
                          data-group="wifi"
                          title="Clear Wi-Fi credentials"
                          type="button"
                        >
                          <svg
                            aria-hidden="true"
                            class="h-3 w-3"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            viewBox="0 0 24 24"
                          >
                            <line x1="18" x2="6" y1="6" y2="18"></line>
                            <line x1="6" x2="18" y1="6" y2="18"></line>
                          </svg>
                        </button>
                      </div>
                      <select
                        aria-label="Wi-Fi Security Type"
                        class="field-input h-8 cursor-pointer px-2 text-xs font-medium"
                        id="wifi-type"
                      >
                        <option value="WPA">WPA/WPA2</option>
                        <option value="SAE">WPA3 (SAE)</option>
                        <option value="WEP">WEP</option>
                        <option value="nopass">Open (No password)</option>
                      </select>
                    </div>
                    <div class="flex items-center gap-2">
                      <input
                        aria-label="Wi-Fi Password"
                        class="field-input h-8 flex-1 px-2.5 text-xs font-medium placeholder-neutral-500"
                        id="wifi-password"
                        placeholder="Network Password"
                        type="password"
                      >
                      <label
                        class="btn-tactile surface-control-field hover:surface-control-field text-caption group flex h-8 shrink-0 cursor-pointer items-center gap-2 rounded-lg border border-transparent px-2.5 font-medium text-neutral-600 transition-all select-none focus-within:border-neutral-300 hover:text-neutral-900"
                        title="Hidden Wi-Fi SSID network"
                      >
                        <span>Hidden</span>
                        <div class="relative inline-flex items-center">
                          <input
                            aria-label="Hidden Wi-Fi SSID network"
                            class="peer sr-only"
                            id="wifi-hidden"
                            type="checkbox"
                          >
                          <div
                            class="peer peer-checked:after:border-panel after:empty-content after:offset-knob after:surface-panel h-4 w-7 rounded-full bg-neutral-200 transition-colors peer-checked:bg-neutral-900 peer-focus-visible:ring-2 peer-focus-visible:ring-neutral-400 after:absolute after:h-3 after:w-3 after:rounded-full after:shadow-sm after:transition-all peer-checked:after:translate-x-3"
                          ></div>
                        </div>
                      </label>
                    </div>
                  </div>

                  <!-- Plain Text -->
                  <div

              <div
                class="tilt-card w-preview h-preview relative flex aspect-square items-center justify-center select-none"
                id="tilt-card"
              >
                <div
                  class="pointer-events-none relative flex h-full w-full items-center justify-center"
                  id="preview-wrapper"
                >
                  <div
                    class="flex h-full w-full items-center justify-center"
                    id="qr-output-container"
                  ></div>
                </div>
                <div
                  aria-hidden="true"
                  class="qz-overlay"
                  id="qz-overlay"
                ></div>
                <div aria-hidden="true" class="drop-hint" id="drop-hint">
                  <span>Drop an image to set the emblem</span>
                </div>
              </div>
            </div>

            <!-- Export Actions Group -->
            <div class="w-preview flex shrink-0 flex-col gap-2">
              <!-- Direct File Downloads -->
              <div class="grid grid-cols-2 gap-2">
                <button
                  class="btn-tactile surface-btn-secondary hover:surface-btn-secondary flex h-9 items-center justify-center gap-1.5 rounded-lg border border-neutral-200 text-xs font-medium text-neutral-700"
                  id="btn-download-svg"
                  title="Download scalable SVG vector file"
                  type="button"
                >
                  <svg
                    aria-hidden="true"
                    class="h-3.5 w-3.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                  >
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" x2="12" y1="15" y2="3"></line>
                  </svg>
                  <span>SVG Vector</span>
                </button>
                <button
                  class="btn-tactile surface-btn-secondary hover:surface-btn-secondary flex h-9 items-center justify-center gap-1.5 rounded-lg border border-neutral-200 text-xs font-medium text-neutral-700"
                  id="btn-download-png"
                  title="Download PNG (2048 px base size, whole pixels per module)"
                  type="button"
                >
                  <svg
                    aria-hidden="true"
                    class="h-3.5 w-3.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                  >
                    <rect
                      height="18"
                      rx="2"
                      ry="2"
                      width="18"
                      x="3"
                      y="3"
                    ></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                  </svg>
                  <span id="png-size-label">PNG 2048 px</span>
                </button>
              </div>

              <!-- Clipboard Handlers -->
              <div class="grid grid-cols-2 gap-2">
                <button
                  class="btn-tactile surface-panel shadow-btn flex h-9 items-center justify-center gap-1.5 rounded-lg border border-neutral-200 text-xs font-medium text-neutral-800 hover:bg-neutral-50"
                  id="btn-copy-svg"
                  title="Copy raw SVG markup to clipboard"
                  type="button"
                >
                  <span class="btn-icon-slot flex items-center justify-center">
                    <svg
                      aria-hidden="true"
                      class="h-3.5 w-3.5 transition-transform duration-200"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                    >
                      <path
                        d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
                      ></path>
                      <rect
                        height="4"
                        rx="1"
                        ry="1"
                        width="8"
                        x="8"
                        y="2"
                      ></rect>
                    </svg>
                  </span>
                  <span class="btn-label-slot transition-all duration-200"
                    >Copy SVG</span
                  >
                </button>
                <button
                  class="btn-tactile surface-panel shadow-btn flex h-9 items-center justify-center gap-1.5 rounded-lg border border-neutral-200 text-xs font-medium text-neutral-800 hover:bg-neutral-50"
                  id="btn-copy-image"
                  title="Copy raster image directly into OS clipboard"
                  type="button"
                >
                  <span class="btn-icon-slot flex items-center justify-center">
                    <svg
                      aria-hidden="true"
                      class="h-3.5 w-3.5 transition-transform duration-200"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                    >
                      <rect
                        height="13"
                        rx="2"
                        ry="2"
                        width="13"
                        x="9"
                        y="9"
                      ></rect>
                      <path
                        d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                      ></path>
                    </svg>
                  </span>
                  <span class="btn-label-slot transition-all duration-200"
                    >Copy Image</span
                  >
                </button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
    <div class="qz-tip" id="qz-tip" role="tooltip"></div>
    <!-- FSD Application Entry -->
    <script src="./src/app/index.js" type="module"></script>
  </body>
</html>
